services:
  postgres:
    image: postgres:16-alpine
    container_name: badminton-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badminton_club
    ports:
      - "5432:5432"
    volumes:
      - badminton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badminton_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  badminton_pgdata:
